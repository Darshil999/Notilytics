@*
* main.scala.html
* ----------------
* Base HTML layout for NotiLytics.
* Wraps around index.scala.html and other templates.
* Defines global page structure, font, and shared styles.
*@
@(title: String)(content: Html)

<!DOCTYPE html>
<html lang="en">
    <head>
        <title>@title</title>

            <!-- Link Play-managed assets -->
        <link rel="stylesheet" media="screen" href="@routes.Assets.versioned("stylesheets/main.css")">
        <link rel="stylesheet" media="screen" href="@routes.Assets.versioned("stylesheets/wordstats.css")">
        <link rel="shortcut icon" type="image/png" href="@routes.Assets.versioned("images/favicon.png")">

            <!-- Global inline styling for base layout only -->
        <style>
                body {
                    margin: 0;
                    padding: 0;
                    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
                    background-color: #f7f8fa;
                    color: #222;
                    line-height: 1.6;
                    transition: background-color 0.3s ease;
                }

                /* Centered layout wrapper */
                .nl-wrapper {
                    max-width: 900px;
                    margin: 40px auto;
                    background: #ffffff;
                    padding: 40px 50px;
                    border-radius: 10px;
                    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
                    animation: fadeInAnim 0.4s ease-in;
                }

                /* Title styling */
                h1, h2 {
                    color: #222;
                    font-weight: 700;
                    margin-bottom: 15px;
                }

                h1.nl-title {
                    text-align: center;
                    font-size: 1.8rem;
                    margin-bottom: 25px;
                }

                /* Article list */
                ol {
                    padding-left: 25px;
                }

                ol li {
                    margin-bottom: 10px;
                    font-size: 1.05rem;
                }

                /* Link styling */
                a {
                    color: #007bff;
                    text-decoration: none;
                    transition: color 0.2s;
                }

                a:hover {
                    text-decoration: underline;
                    color: #0056b3;
                }

                /* Special "More stats" link */
                a.wordstats-link {
                    color: #4B0082;
                    font-weight: 600;
                    text-decoration: none;
                }

                a.wordstats-link:hover {
                    text-decoration: underline;
                }

                /* Keyframes (Twirl-safe) */
                @Html("""
                    @keyframes fadeInAnim {
                        from { opacity: 0; transform: translateY(10px); }
                        to { opacity: 1; transform: translateY(0); }
                    }
                """)
        </style>
    </head>

    <body>
        @content

            <!-- JavaScript assets -->
        <script src="@routes.Assets.versioned("javascripts/main.js")" type="text/javascript"></script>
    </body>
</html>
